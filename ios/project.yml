name: Slate
options:
  bundleIdPrefix: com.avalonlotus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Slate:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../Shared
        name: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avalonlotus.slate
        PRODUCT_NAME: Slate
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_NSFaceIDUsageDescription: 用 Face ID 解鎖保險庫
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
